services:
  postgres:
    image: postgres:16-alpine
    container_name: tenderiq-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tenderiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tenderiq}
      POSTGRES_DB: ${POSTGRES_DB:-tenderiq}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tenderiq} -d ${POSTGRES_DB:-tenderiq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: tenderiq-qdrant
    ports:
      - "${QDRANT_PORT:-6343}:6333"
      - "${QDRANT_GRPC_PORT:-6344}:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["app"]
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      JOB_EXECUTION_MODE: database
      WEB_CONCURRENCY: 2
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 5
    ports: ["8100:8100"]
    volumes: ["documentstore:/data/store"]
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_healthy}
    restart: unless-stopped

  worker:
    profiles: ["app"]
    build: ./backend
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.worker"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      JOB_EXECUTION_MODE: database
      DB_POOL_SIZE: 2
      DB_MAX_OVERFLOW: 2
    volumes: ["documentstore:/data/store"]
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_healthy}
    restart: unless-stopped

  web:
    profiles: ["app"]
    build:
      context: ./frontend
      args: {NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8100}"}
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  qdrantdata:
  documentstore:
