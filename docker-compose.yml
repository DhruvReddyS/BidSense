services:
  postgres:
    image: postgres:16-alpine
    container_name: tenderiq-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tenderiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tenderiq}
      POSTGRES_DB: ${POSTGRES_DB:-tenderiq}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tenderiq} -d ${POSTGRES_DB:-tenderiq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: tenderiq-qdrant
    ports:
      - "${QDRANT_PORT:-6343}:6333"
      - "${QDRANT_GRPC_PORT:-6344}:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  qdrantdata:
